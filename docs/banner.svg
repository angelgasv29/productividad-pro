<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Productividad Pro">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="55%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#172554"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="bar1" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
    <linearGradient id="bar2" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#67e8f9"/>
    </linearGradient>
    <linearGradient id="bar3" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="18" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="300" rx="24" fill="url(#bg)"/>
  <circle cx="1035" cy="55" r="170" fill="#7c3aed" opacity="0.18"/>
  <circle cx="1140" cy="265" r="150" fill="#06b6d4" opacity="0.12"/>
  <circle cx="930" cy="240" r="95" fill="#8b5cf6" opacity="0.10"/>

  <g transform="translate(64 92)">
    <rect x="0" y="34" width="18" height="54" rx="5" fill="url(#bar1)"/>
    <rect x="26" y="12" width="18" height="76" rx="5" fill="url(#bar2)"/>
    <rect x="52" y="0" width="18" height="88" rx="5" fill="url(#bar3)"/>
  </g>

  <text x="150" y="140" fill="#ffffff" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="52" font-weight="700" letter-spacing="-1">Productividad Pro</text>
  <text x="153" y="178" fill="#c7d2fe" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="20">Hábitos · Rutinas · Backlog · Objetivos · Timer Pro</text>

  <g font-family="Segoe UI, Inter, Arial, sans-serif" font-size="14" font-weight="600">
    <rect x="153" y="207" width="118" height="34" rx="17" fill="#ffffff" opacity="0.08"/>
    <text x="212" y="229" text-anchor="middle" fill="#ddd6fe">LOCAL-FIRST</text>
    <rect x="283" y="207" width="132" height="34" rx="17" fill="#ffffff" opacity="0.08"/>
    <text x="349" y="229" text-anchor="middle" fill="#a5f3fc">MULTIUSUARIO</text>
    <rect x="427" y="207" width="92" height="34" rx="17" fill="#ffffff" opacity="0.08"/>
    <text x="473" y="229" text-anchor="middle" fill="#fde68a">FASTAPI</text>
    <rect x="531" y="207" width="82" height="34" rx="17" fill="#ffffff" opacity="0.08"/>
    <text x="572" y="229" text-anchor="middle" fill="#bbf7d0">SQLITE</text>
  </g>

  <g transform="translate(940 86)">
    <circle cx="95" cy="95" r="78" fill="none" stroke="#ffffff" stroke-opacity="0.10" stroke-width="18"/>
    <circle cx="95" cy="95" r="78" fill="none" stroke="url(#accent)" stroke-width="18" stroke-linecap="round" stroke-dasharray="380 490" transform="rotate(-90 95 95)" filter="url(#glow)"/>
    <text x="95" y="94" text-anchor="middle" fill="#ffffff" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="38" font-weight="700">85</text>
    <text x="95" y="120" text-anchor="middle" fill="#c7d2fe" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="13" font-weight="600" letter-spacing="2">SCORE</text>
  </g>

  <text x="1130" y="268" text-anchor="end" fill="#94a3b8" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="13">v4.0.0 · 2026</text>
</svg>
